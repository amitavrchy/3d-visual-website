<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#020208"/>
  <!-- soft glow -->
  <circle cx="16" cy="16" r="9" fill="#ff9a3c" opacity="0.18"/>
  <circle cx="16" cy="16" r="6.2" fill="url(#sunGrad)"/>
  <circle cx="14.2" cy="14.2" r="2.2" fill="#ffe0a0" opacity="0.55"/>
  <!-- orbit ring -->
  <ellipse cx="16" cy="16" rx="12.5" ry="7.2" stroke="#4AF2C8" stroke-width="1.35" opacity="0.9" transform="rotate(-28 16 16)"/>
  <!-- planet on orbit -->
  <circle cx="26.2" cy="11.4" r="2.15" fill="#4AF2C8"/>
  <circle cx="25.5" cy="10.8" r="0.7" fill="#d8fff4" opacity="0.7"/>
  <defs>
    <radialGradient id="sunGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </radialGradient>
  </defs>
</svg>
